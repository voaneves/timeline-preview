<!DOCTYPE html>

  <script type="module" crossorigin src="./assets/index-CwNx-F6S.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-XKyaHtl9.js">
  <link rel="modulepreload" crossorigin href="./assets/three.webgpu-DCUCBI0r.js">
  <link rel="modulepreload" crossorigin href="./assets/Game-EQM9oFMw.js">
  <link rel="stylesheet" crossorigin href="./assets/index-DiK0LoC9.css">
</head>
<body>
    <div class="vn-loader js-loader" role="status" aria-live="polite" aria-label="Carregando linha do tempo">
        <div class="vn-loader-inner">
            <svg class="vn-loader-svg" viewBox="0 0 280 48" width="280" height="48" aria-hidden="true">
                <line class="vn-loader-track" x1="16" y1="30" x2="246" y2="30" />
                <line class="vn-loader-line js-loader-line" x1="16" y1="30" x2="246" y2="30" />
                <circle class="vn-loader-dot js-loader-dot" cx="262" cy="30" r="6" />
            </svg>
            <span class="vn-loader-pct js-loader-pct">0%</span>
        </div>
    </div>

    <main class="game">
        <h1 class="sr-only">Linha do Tempo 3D — Victor Alves Neves</h1>
        <canvas class="js-canvas" tabindex="0" role="application" aria-label="Linha do Tempo 3D" aria-describedby="canvas-controls-desc"></canvas>
        <p id="canvas-controls-desc" class="sr-only">Use WASD ou setas para andar, Espaço para pular, Shift ou C para carimbar, F para interagir, arraste para girar a câmera e P para pausar.</p>

        <div class="js-touch-controls touch-controls" aria-label="Controles de toque">
            <div class="js-touch-joystick touch-joystick" aria-hidden="true">
                <svg class="touch-joystick-svg" viewBox="-72 -72 144 144" width="144" height="144">
                    <circle class="touch-joystick-ring" cx="0" cy="0" r="64" />
                    <circle class="touch-joystick-deadzone" cx="0" cy="0" r="10" />
                    <line class="js-touch-joystick-stick touch-joystick-stick" x1="0" y1="0" x2="0" y2="0" />
                    <circle class="js-touch-joystick-knob touch-joystick-knob" cx="0" cy="0" r="18" />
                </svg>
            </div>

            <div class="touch-camera-controls" role="group" aria-label="Girar câmera">
                <button type="button" class="js-touch-orbit-left touch-btn touch-camera-btn" aria-label="Girar câmera para a esquerda">&#x27F2;</button>
                <button type="button" class="js-touch-orbit-right touch-btn touch-camera-btn" aria-label="Girar câmera para a direita">&#x27F3;</button>
            </div>

            <button type="button" class="js-touch-stamp touch-btn touch-stamp-btn" aria-label="Carimbar">
                <span class="touch-btn-label">Carimbar</span>
            </button>

            <button type="button" class="js-touch-jump touch-btn touch-jump-hint" aria-label="Pular">
                <span class="touch-btn-label">Pular</span>
            </button>
        </div>

        <div class="js-touch-buttons touch-buttons">
            <div class="js-overlay overlay"></div>
            <div class="buttons">
                <button type="button" data-name="interact" class="js-button touch-btn interact">Interagir</button>
            </div>
        </div>
    </main>

</body>
</html>
